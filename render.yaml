services:
  - type: web
    name: cits-skill-gap-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      # Optional: point this at a managed MySQL / Postgres database.
      # Free Render web services have an ephemeral disk, so a local SQLite
      # file is re-seeded with demo data on every deploy.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: cits-mysql
      #     property: connectionString
